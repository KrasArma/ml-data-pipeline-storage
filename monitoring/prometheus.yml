global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'fastapi-service'
    metrics_path: /metrics
    static_configs:
      - targets: ['service:5051']

  - job_name: 'airflow-webserver'
    metrics_path: /admin/metrics
    static_configs:
      - targets: ['airflow-webserver:8080']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
